[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
markers =
    postgres_integration: marks tests requiring a running PostgreSQL instance (deselect with '-m "not postgres_integration"')
    docker: marks container deployment smoke tests requiring a running Docker daemon (deselect with '-m "not docker"')
