name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-offline:
    name: Unit & Offline Test Suite (Isolated from PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Validate dependency consistency
        run: pip check

      - name: Run offline test suite with unreachable DATABASE_URL
        env:
          # Intentionally unreachable database URL to enforce test isolation
          DATABASE_URL: "postgresql://ci_isolated:invalid_pass@127.0.0.1:59999/nonexistent"
          API_AUTH_TOKEN: "ci-test-token"
        run: |
          pytest -m "not postgres_integration and not docker" -v

      - name: Validate Kubernetes Manifests (KRM & Kustomize)
        run: |
          kubectl kustomize deploy/kubernetes

  test-postgres-integration:
    name: PostgreSQL Integration Tests (Service-Backed)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
          TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
          API_AUTH_TOKEN: "ci-test-token"
        run: |
          pytest -m "postgres_integration" -v

  docker-build:
    name: Docker Packaging & Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: [test-offline]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for Smoke Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install locked dependencies for Smoke Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t business-intelligence-api:ci .

      - name: Run Automated Container Deployment Smoke Tests
        env:
          DOCKER_IMAGE_TAG: "business-intelligence-api:ci"
        run: |
          pytest -m "docker" -v

  frontend-build:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: dashboard
        run: npm run build
