apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-frontend-deployment
  labels:
    app.kubernetes.io/name: business-intelligence-frontend
    app.kubernetes.io/part-of: business-opportunity-platform
    app.kubernetes.io/component: frontend
spec:
  # Next.js standalone frontend is stateless and can scale or perform rolling updates
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: business-intelligence-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-intelligence-frontend
        app.kubernetes.io/part-of: business-opportunity-platform
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: business-intelligence-frontend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "server.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          envFrom:
            - configMapRef:
                name: bi-frontend-config
          env:
            # Shared secret injected server-side by Next.js API proxy and server components into X-API-Key
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bi-api-secret
                  key: API_AUTH_TOKEN
            # NOTE: DATABASE_URL is strictly omitted; the frontend has zero direct database connectivity
          # Startup probe allows Next.js standalone server initialization before liveness checks
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 6
          # Liveness probe monitors Next.js server health
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness probe verifies application availability for user traffic routing
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
