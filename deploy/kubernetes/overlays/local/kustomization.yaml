apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit core application workloads from shared base
resources:
  - ../../base
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-pvc.yaml

generatorOptions:
  disableNameSuffixHash: true

# Package repository schema into in-cluster ConfigMap for initial database initialization
configMapGenerator:
  - name: bi-postgres-schema
    files:
      - 01_schema.sql=01_schema.sql

# Local development secret provisioning (DO NOT USE IN PRODUCTION)
secretGenerator:
  - name: bi-api-secret
    literals:
      - API_AUTH_TOKEN=dev-secret-token-change-in-prod
      - DATABASE_URL=postgresql://bi_user:bi_password@bi-postgres-service:5432/bi_db
      - GEMINI_API_KEY=""
