apiVersion: v1
kind: Secret
metadata:
  name: bi-api-secret
  labels:
    app.kubernetes.io/name: business-intelligence-api
    app.kubernetes.io/part-of: business-opportunity-platform
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # REQUIRED: Server-side API authentication token used by verify_api_key (constant-time verification).
  # Generate a cryptographically secure token: openssl rand -hex 32
  API_AUTH_TOKEN: "REPLACE_WITH_STRONG_RANDOM_SECRET"

  # OPTIONAL: External PostgreSQL connection URL (e.g., postgresql://user:pass@postgres-host:5432/bi_db).
  # If omitted or empty, the API operates safely in standalone mode without a database.
  DATABASE_URL: ""

  # OPTIONAL: Google Gemini API key for LLM capability reasoning.
  # If omitted, deterministic fallback analysis is safely used without marking the service unready.
  GEMINI_API_KEY: ""
